[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracezero"
version = "0.1.0"
description = "Open-source Plagiarism Checker, local multi-model AI Content Detector, Fast-DetectGPT perplexity auditor, PDF hygiene checker, and text humanizer."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sai Thilak T"}
]
keywords = [
    "plagiarism-checker",
    "plagiarism-detection",
    "plagiarism",
    "ai-detector",
    "ai-content-detector",
    "humanizer",
    "text-humanizer",
    "similarity",
    "tfidf",
    "nlp",
    "perplexity",
    "fast-detectgpt",
    "stylometry",
    "pdf-hygiene",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tracezero = "tracezero.cli:app"

[project.urls]
Homepage = "https://codethief831.github.io/TraceZero/"
Repository = "https://github.com/CodeThief831/TraceZero"
Documentation = "https://github.com/CodeThief831/TraceZero#readme"
Issues = "https://github.com/CodeThief831/TraceZero/issues"
Funding = "https://github.com/sponsors/CodeThief831"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracezero = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
